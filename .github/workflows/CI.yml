name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Tests, 80% coverage, and SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests, enforce coverage, and analyze
        run: ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBDIETSERVICE_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
